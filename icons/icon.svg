<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Scrollshot">
  <defs>
    <linearGradient id="ss-page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#2f9dff"/>
    </linearGradient>
    <linearGradient id="ss-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c1ff"/>
      <stop offset="1" stop-color="#6d4aff"/>
    </linearGradient>
    <mask id="ss-cut">
      <rect width="48" height="48" fill="#fff"/>
      <circle cx="33" cy="33" r="15.5" fill="#000"/>
    </mask>
  </defs>

  <!-- the long page -->
  <g mask="url(#ss-cut)">
    <rect x="6.5" y="3.5" width="26" height="41" rx="5"
          fill="none" stroke="url(#ss-page)" stroke-width="3.4"/>
    <g stroke="url(#ss-page)" stroke-width="3" stroke-linecap="round">
      <path d="M13 13.5h13"/>
      <path d="M13 21h13"/>
      <path d="M13 28.5h8"/>
    </g>
  </g>

  <!-- the shutter -->
  <circle cx="33" cy="33" r="11.5" fill="url(#ss-lens)"/>
  <g stroke="#fff" stroke-width="2.6" stroke-linecap="round">
    <path d="M33 28.4V21.6"/>
    <path d="m36.9 35.2 5.9 3.4"/>
    <path d="m29.1 35.2-5.9 3.4"/>
  </g>
  <circle cx="33" cy="33" r="4.2" fill="#fff"/>
</svg>
